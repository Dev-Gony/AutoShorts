name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Korean test fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-nanum
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q src scripts tests app.py config.py streamlit_app.py
      - name: Unit and real render tests (no paid API calls)
        run: python -m pytest -q --junitxml=validation-results.xml
      - name: Package exact tested source (no keys or fonts)
        if: always()
        run: git archive --format=zip --output="${RUNNER_TEMP}/validation-source.zip" HEAD
      - name: Upload validation source and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-source
          path: |
            ${{ runner.temp }}/validation-source.zip
            validation-results.xml
          retention-days: 3
